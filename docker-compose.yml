version: '3.8'

services:
  chinese-class:
    image: ghcr.io/artshooter/chinese-class:latest
    container_name: chinese-class
    restart: unless-stopped
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chinese-class.rule=Host(`chinese-class.ashooter.com`)"
      - "traefik.http.services.chinese-class.loadbalancer.server.port=80"

networks:
  traefik-net:
    external: true
