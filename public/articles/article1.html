<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课文示例</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SimSun', 'Microsoft YaHei', serif;
            line-height: 1.8;
            background: linear-gradient(135deg, #f5e6d3 0%, #e8d5c0 100%);
            padding: 40px;
            color: #333;
        }

        .article-container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 60px;
            border-radius: 4px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .article-title {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            color: #1a1a1a;
            border-bottom: 2px solid #d4a574;
            padding-bottom: 15px;
        }

        .article-author {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .article-content {
            font-size: 16px;
            line-height: 2;
            text-indent: 2em;
            color: #333;
        }

        .article-content p {
            margin-bottom: 1.5em;
        }
    </style>
</head>
<body>
    <div class="article-container">
        <h1 class="article-title">春天的校园</h1>
        <div class="article-author">作者：示例</div>
        <div class="article-content">
            <p>春天到了，校园里充满了生机。树木萌发新芽，花卉争相绽放。清晨，当第一缕阳光洒落在校园的角角落落时，一切都变得生动起来。</p>
            <p>学生们在操场上欢快地奔跑，笑声回荡在校园的每一个角落。教室里，同学们专注地听讲，粉笔在黑板上舞动，知识在心中扎根。</p>
            <p>春天的校园，是梦想的摇篮，是知识的殿堂。在这里，我们学到知识，收获友谊，展望未来。愿我们在春天的校园里，如春风一样温暖，如春雨一样润物无声。</p>
        </div>
    </div>
</body>
</html>
